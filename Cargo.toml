[workspace]
resolver = "3"
members = [
  "crates/hyperai-acp",
  "crates/hyperai-application",
  "crates/hyperai-data",
  "crates/hyperai-eval",
  "crates/hyperai-fleet",
  "crates/hyperai-foundation",
  "crates/hyperai-local-service",
  "crates/hyperai-mcp",
  "crates/hyperai-tui",
  "crates/hyperai-trade",
  "crates/hyperintel-adapter",
  "crates/hyperai-scm-adapter",
  "crates/hyperai-market",
  "crates/outcomes-domain",
  "crates/outcomes-registry",
  "crates/outcomes-corpus",
  "crates/outcomes-source",
  "crates/outcomes-harness",
  "crates/outcomes-runner",
  "crates/outcomes-evidence",
  "crates/outcomes-resolution",
  "crates/outcomes-settlement",
  "crates/outcomes-application",
  "crates/outcomes-persistence-sqlx",
  "crates/outcomes-blobstore",
  "crates/hyperliquid-hip4",
  "crates/outcomes-api",
  "crates/outcomes-cli",
  "crates/outcomes-worker",
]
exclude = ["products/hyperintel", "products/justai"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
publish = false

[workspace.dependencies]
agent-client-protocol = "=2.2.0"
agent-client-protocol-rmcp = { version = "=3.1.1", default-features = false }
hyperai-foundation = { path = "crates/hyperai-foundation" }
hyperai-trade = { path = "crates/hyperai-trade" }
object_store = { version = "=0.12.5", default-features = false }
async-trait = "=0.1.89"
axum = { version = "=0.8.9", default-features = false, features = ["json", "tokio", "http1"] }
base64 = "=0.22.1"
clap = { version = "=4.6.1", features = ["derive"] }
crossterm = "=0.29.0"
data-encoding = "=2.11.0"
datafusion = { version = "=52.5.0", default-features = false, features = ["parquet", "recursive_protection", "sql"] }
directories = "=6.0.0"
fs2 = "=0.4.3"
futures-util = "=0.3.32"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = "=0.4.3"
proptest = "=1.11.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rustix = { version = "=1.1.4", features = ["process"] }
schemars = { version = "=1.2.1", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_json_canonicalizer = "=0.3.2"
secp256k1 = { version = "=0.31.1", default-features = false, features = ["std", "recovery"] }
sha2 = "=0.11.0"
sha3 = "=0.10.9"
sqlparser = { version = "=0.59.0", default-features = false, features = ["std", "visitor"] }
subtle = "=2.6.1"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "migrate", "json"] }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
time = { version = "=0.3.53", default-features = false, features = ["formatting", "parsing"] }
tokio = { version = "=1.52.3", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["compat"] }
tower = { version = "=0.5.3", features = ["util"] }
unicode-normalization = "=0.1.25"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
