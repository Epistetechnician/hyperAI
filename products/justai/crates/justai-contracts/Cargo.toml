[package]
name = "justai-contracts"
version = "0.1.0"
edition = "2021"
description = "Fail-closed contracts for JustAI public observatory releases"
license = "Apache-2.0"

[lib]
name = "justai_contracts"
path = "src/lib.rs"

[[bin]]
name = "justai-contracts"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }

