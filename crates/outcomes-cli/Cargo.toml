[package]
name = "outcomes-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "hyperai"

[features]
tui-panic-test-support = ["hyperai-tui/test-support"]

[dependencies]
clap.workspace = true
hyperai-application = { path = "../hyperai-application" }
hyperai-local-service = { path = "../hyperai-local-service" }
hyperai-acp = { path = "../hyperai-acp" }
hyperai-eval = { path = "../hyperai-eval" }
hyperai-tui = { path = "../hyperai-tui" }
hyperliquid-hip4 = { path = "../hyperliquid-hip4" }
hyperai-market = { path = "../hyperai-market" }
outcomes-api = { path = "../outcomes-api" }
outcomes-application = { path = "../outcomes-application" }
outcomes-blobstore = { path = "../outcomes-blobstore" }
outcomes-corpus = { path = "../outcomes-corpus" }
outcomes-domain = { path = "../outcomes-domain" }
outcomes-evidence = { path = "../outcomes-evidence" }
outcomes-settlement = { path = "../outcomes-settlement" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[[bin]]
name = "hyperai"
path = "src/main.rs"

[[bin]]
name = "hsai"
path = "src/bin/hsai.rs"

[[bin]]
name = "hyperai-ui"
path = "src/bin/hyperai-ui.rs"
